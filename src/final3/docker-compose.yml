version: "3.9"

services:
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - db
    environment:
      NODE_ENV: production
      API_KEY: "123456"  

  db:
    image: postgres
    restart: always
    ports:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres  
      POSTGRES_DB: mydb

  redis:
    image: redis
    ports:
      - 6379
      
  cache:
    image: redis
    ports:
      - "6379:6379"
    depends_on:
      - redis
